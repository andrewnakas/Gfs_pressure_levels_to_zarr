name: Update GFS Pressure Level Data

on:
  # Run every 6 hours at :30 past the hour (offset from GFS cycle times)
  # GFS cycles: 00, 06, 12, 18 UTC - we run at 03:30, 09:30, 15:30, 21:30 UTC
  schedule:
    - cron: '30 3,9,15,21 * * *'

  # Allow manual triggering
  workflow_dispatch:

  # Test on push to claude branches
  push:
    branches:
      - 'claude/**'

jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libeccodes-dev libeccodes-tools

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download and process GFS data
        id: update
        run: |
          echo "Starting GFS data update..."
          python scripts/update_gfs_zarr.py

          # Check if data was created
          if [ -d "data/gfs-pressure-levels.zarr" ]; then
            echo "data_created=true" >> $GITHUB_OUTPUT

            # Calculate size
            SIZE=$(du -sh data/gfs-pressure-levels.zarr | cut -f1)
            echo "zarr_size=$SIZE" >> $GITHUB_OUTPUT
            echo "Zarr store size: $SIZE"
          else
            echo "data_created=false" >> $GITHUB_OUTPUT
            echo "ERROR: Zarr store was not created"
            exit 1
          fi

      - name: Configure Git
        if: steps.update.outputs.data_created == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Commit and push to data branch
        if: steps.update.outputs.data_created == 'true'
        run: |
          # Create or switch to data branch
          git fetch origin data:data 2>/dev/null || git checkout -b data || git checkout data

          # Remove all existing files
          git rm -rf . 2>/dev/null || true

          # Copy new data
          cp -r data/gfs-pressure-levels.zarr .

          # Add and commit
          git add gfs-pressure-levels.zarr/

          # Create commit message with timestamp
          TIMESTAMP=$(date -u '+%Y-%m-%d %H:%M UTC')
          git commit -m "Update GFS pressure level data - $TIMESTAMP" \
                     -m "Zarr store size: ${{ steps.update.outputs.zarr_size }}" \
                     -m "Automated update via GitHub Actions"

          # Push to data branch (force push to keep history clean)
          git push -f origin data

      - name: Create data summary
        if: steps.update.outputs.data_created == 'true'
        run: |
          python - <<EOF
          import xarray as xr
          import json
          from datetime import datetime

          # Open the zarr store
          ds = xr.open_zarr('data/gfs-pressure-levels.zarr', consolidated=True)

          # Create summary
          summary = {
              'updated': datetime.utcnow().isoformat(),
              'initialization_time': ds.attrs.get('initialization_time'),
              'dimensions': dict(ds.dims),
              'variables': list(ds.data_vars.keys()),
              'coordinates': list(ds.coords.keys()),
              'forecast_hours': ds.attrs.get('forecast_hours', []),
              'grid_resolution': ds.attrs.get('grid_resolution'),
              'zarr_size': '${{ steps.update.outputs.zarr_size }}'
          }

          # Save to file
          with open('data-summary.json', 'w') as f:
              json.dump(summary, f, indent=2)

          # Print summary
          print("=" * 60)
          print("GFS PRESSURE LEVEL DATA SUMMARY")
          print("=" * 60)
          for key, value in summary.items():
              print(f"{key}: {value}")
          print("=" * 60)
          EOF

      - name: Upload summary artifact
        if: steps.update.outputs.data_created == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: data-summary
          path: data-summary.json
          retention-days: 30

      - name: Report status
        if: always()
        run: |
          if [ "${{ steps.update.outputs.data_created }}" == "true" ]; then
            echo "✅ GFS data update completed successfully"
            echo "📊 Zarr size: ${{ steps.update.outputs.zarr_size }}"
          else
            echo "❌ GFS data update failed"
            exit 1
          fi
